<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CreatorRizz Logo & Brand Identity</title>
    <style>
        body { background: #090A0F; color: #F8FAFC; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #12151E; border: 1px solid #1E293B; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .logo-mark { width: 96px; height: 96px; background: linear-gradient(135deg, #6366F1 0%, #A855F7 100%); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; box-shadow: 0 10px 25px rgba(99,102,241,0.4); }
        h1 { font-size: 32px; font-weight: 800; margin: 0 0 8px 0; background: linear-gradient(to right, #818CF8, #C084FC); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94A3B8; margin: 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-mark">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <h1>CreatorRizz</h1>
        <p>AI-Powered YouTube Shorts & Viral Intelligence Platform</p>
    </div>
</body>
</html>
